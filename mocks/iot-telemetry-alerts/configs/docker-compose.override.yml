# IoT Telemetry Alerts - local stack extensions
# Usage: docker compose -f docker-compose.yml -f mocks/iot-telemetry-alerts/configs/docker-compose.override.yml up -d
version: "3.9"

services:
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.6.0
    container_name: iot-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - datatrucker-net

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.6.0
    container_name: iot-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - datatrucker-net

  webhook-mock:
    image: docker.io/mockserver/mockserver:5.15.0
    container_name: iot-webhook-mock
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    volumes:
      - ./webhook-expectations.json:/config/expectations.json:ro
    networks:
      - datatrucker-net

  keycloak:
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/iot-telemetry-realm.json:ro

  api:
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_TELEMETRY: iot.telemetry.raw
      KAFKA_TOPIC_ALERTS: iot.alerts.dispatch
      REDIS_KEY_PREFIX: "iot:telemetry:"
      USECASE: iot-telemetry-alerts
    depends_on:
      - kafka

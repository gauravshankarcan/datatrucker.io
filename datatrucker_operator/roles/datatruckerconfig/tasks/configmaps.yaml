- set_fact:
    CRYPTO: "{{ merged_api.crypto | to_json }}" 
    RESOURCE: "{{ merged_api.resource | to_json }}" 
    LOGINSERVER: "{{ merged_api.loginServer | to_json }}" 
    MGMTSSERVER: "{{ merged_api.managementServer | to_json }}"
    JOBSSERVER: "{{ merged_api.jobsServer | to_json }}"
    DBSSERVER: |
      {
                    "type": "{{ DB.type }}",
                    "host": "{{ DB.hostname }}",
                    "port": {{ DB.port }},
                    "username": "{{ DB.user }}",
                    "password": "{{ DB.password }}",
                    "database": "{{ DB.databasename }}",
                    "PoolMin": 300,
                    "PoolMax": 600
      }

- name: create a login-config
  kubernetes.core.k8s:
    state: present
    definition:
      kind: Secret
      apiVersion: v1
      type: Opaque
      metadata:
        name: '{{ ansible_operator_meta.name }}-login-config'
        namespace: '{{ ansible_operator_meta.namespace }}'
      data:
        publicJWT.key: "{{ merged_api.cryptokeys.publicJWTkey }}"
        privateJWT.key: "{{ merged_api.cryptokeys.privateJWTkey }}"
        truckerapi.crt: "{{ merged_api.cryptokeys.truckerapicrt }}"
        truckerapi.key: "{{ merged_api.cryptokeys.truckerapikey }}"
        keycloak.key: "{{ merged_api.cryptokeys.keycloakkey }}"
        crypto.config.json: "{{ CRYPTO  | b64encode}}"
        db.config.json: "{{ DBSSERVER    | to_json | b64encode }}"
        resource.config.json: "{{ RESOURCE  | b64encode}}"
        server.config.json: "{{ LOGINSERVER  | b64encode}}"


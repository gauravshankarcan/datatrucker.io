- name: create a dummyconfigmap
  kubernetes.core.k8s:
    state: present
    definition: 
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: 'placeholder'
        namespace: '{{ ansible_operator_meta.namespace }}'
      data: 
        placholder: 'dummy'            
kind: CustomResourceDefinition
metadata:
  name: datatruckerinits.datatrucker.datatrucker.io
spec:
  group: datatrucker.datatrucker.io
  names:
    kind: DatatruckerInit
    listKind: DatatruckerInitList
    plural: datatruckerinits
    singular: datatruckerinit
    shortNames:
    - dtinit
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: DatatruckerInit bootstraps admin user and platform initialization via CR.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [configRef, adminUsername, adminPassword]
            properties:
              configRef:
                type: string

              adminPassword:
                type: string
              initializeDb:
                type: boolean
                default: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - jsonPath: .spec.configRef
      name: Config
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datatruckertenants.datatrucker.datatrucker.io
spec:
  group: datatrucker.datatrucker.io
  names:
    kind: DatatruckerTenant
    listKind: DatatruckerTenantList
    plural: datatruckertenants
    singular: datatruckertenant
    shortNames:
    - dttenant
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: DatatruckerTenant provisions a multi-tenant namespace with Config and default Flow CRs.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [tenantId, adminEmail]
            properties:
              tenantId:
                type: string
                pattern: '^[a-z0-9-]+$'
              orgName:
                type: string
              plan:
                type: string
                enum: [starter, professional, enterprise]
              adminEmail:
                type: string
              createNamespace:
                type: boolean
                default: false
              roles:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    permissions:
                      type: array
                      items:
                        type: string
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
